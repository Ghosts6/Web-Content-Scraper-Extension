name: CI

on:
  push:
    branches: [ main, store-firefox ]
  pull_request:
    branches: [ main, store-firefox ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Firefox variant
      run: |
        docker build --build-arg TARGET_BROWSER=firefox -t web-content-scraper-extension:firefox .

    - name: Run tests
      run: |
        cd app
        npm install
        npm test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/test-results/jest-junit.xml
        retention-days: 5
