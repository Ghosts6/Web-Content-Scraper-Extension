
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and export for Chrome
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: web-content-scraper-extension:latest
        outputs: type=docker,dest=/tmp/web-content-scraper-extension-chrome.tar

    - name: Build and export for Firefox
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: web-content-scraper-extension:latest
        outputs: type=docker,dest=/tmp/web-content-scraper-extension-firefox.tar
        build-args: |
          TARGET_BROWSER=firefox

    - name: Run tests
      run: |
        docker run --rm web-content-scraper-extension:latest /bin/sh -c "cd app && npm test"
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: app/test-results/jest-junit.xml
